name: Daily job pull
on:
  schedule:
    - cron: "40 2 * * *"   # 08:10 IST every day
  workflow_dispatch: {}     # lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scan.py
      - name: Save results
        run: |
          git config user.name "job-pull-bot"
          git config user.email "actions@users.noreply.github.com"
          git add jobs/latest.json
          git commit -m "Job pull $(date -u +%F)" || echo "nothing new"
          git push
